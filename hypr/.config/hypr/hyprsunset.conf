# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# To enable the scheduled profile, install hyprsunset and start it from
# modules/autostart.lua with: hl.exec_cmd("uwsm app -t service -- hyprsunset")
# Then replace the identity profile above with:
# profile {
#     time = 20:00
#     temperature = 4000
# }
